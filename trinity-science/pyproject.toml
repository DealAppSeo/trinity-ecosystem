[project]
name = "trinity-science"
version = "0.1.0"
description = "The Scientific Brain of the Trinity Ecosystem (GNN/ANFIS Microservice)"
authors = [{ name = "Trinity Science Team", email = "science@trinity.ai" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "numpy>=1.26.0",
    "networkx>=3.2.1",
    "scikit-fuzzy>=0.4.2",
    "pydantic>=2.7.0",
    "pydantic-ai>=0.0.14",
    "structlog>=24.1.0",
    "arize-phoenix>=2.0.0",
    "openinference-instrumentation-pydantic-ai>=0.1.0",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp",
    "python-dotenv>=1.0.1",
    # PyTorch (CPU for standard dev, CUDA if available in PROD)
    "torch>=2.2.0", 
    "torch_geometric>=2.5.0",
    "prometheus_client>=0.20.0",
    "supabase>=2.3.0",
    "crewai>=0.28.0",
    "llama-index>=0.10.0",
    "autogen-agentchat>=0.2.0",
    "lightrag-hkm>=1.0.1",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
