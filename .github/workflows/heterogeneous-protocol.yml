name: Heterogeneous Protocol Validator

on:
  issues:
    types: [opened, edited, labeled]
  pull_request:
    types: [opened, edited, labeled, review_requested]
  issue_comment:
    types: [created]

jobs:
  validate-heterogeneous-protocol:
    runs-on: ubuntu-latest
    name: Validate Agent Diversity
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      
      - name: Validate Protocol Compliance
        uses: actions/github-script@v7
        with:
          script: |
            const AGENTS = ['claude', 'gemini', 'grok', 'antigravity'];
            const AGENT_LABELS = {
              'agent:claude': 'claude',
              'agent:gemini': 'gemini', 
              'agent:grok': 'grok',
              'agent:antigravity': 'gemini', // Antigravity = Gemini
              'author:claude': 'claude',
              'author:gemini': 'gemini',
              'author:grok': 'grok',
              'verifier:claude': 'claude',
              'verifier:gemini': 'gemini',
              'verifier:grok': 'grok'
            };
            
            let issue = context.payload.issue || context.payload.pull_request;
            if (!issue) {
              console.log('No issue or PR found in payload');
              return;
            }
            
            const labels = issue.labels.map(l => l.name.toLowerCase());
            
            // Find author and verifier labels
            let author = null;
            let verifier = null;
            
            for (const label of labels) {
              if (label.startsWith('author:')) {
                author = AGENT_LABELS[label];
              }
              if (label.startsWith('verifier:')) {
                verifier = AGENT_LABELS[label];
              }
            }
            
            // Check if this is a verification or handoff issue
            const isVerification = labels.includes('verification') || 
                                   labels.includes('heterogeneous-protocol') ||
                                   labels.includes('handoff');
            
            if (!isVerification) {
              console.log('Not a verification/handoff issue, skipping check');
              return;
            }
            
            // Validate heterogeneous protocol
            if (author && verifier) {
              if (author === verifier) {
                // VIOLATION: Same agent as author and verifier
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `## ⚠️ Heterogeneous Protocol Violation

**Author:** ${author}
**Verifier:** ${verifier}

🚫 **The verifying agent MUST be different from the authoring agent.**

Please update the verifier label to a different agent:
- If author is Claude → verifier must be Gemini or Grok
- If author is Gemini → verifier must be Claude or Grok  
- If author is Grok → verifier must be Claude or Gemini

This ensures bias mitigation through diverse LLM perspectives.

---
*Automated check by Trinity Symphony Heterogeneous Protocol Validator*`
                });
                
                // Add violation label
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  labels: ['protocol-violation']
                });
                
                core.setFailed('Heterogeneous Protocol Violation: Author and Verifier are the same agent');
              } else {
                // COMPLIANT
                console.log(`✅ Protocol compliant: Author=${author}, Verifier=${verifier}`);
                
                // Remove violation label if present
                try {
                  await github.rest.issues.removeLabel({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issue.number,
                    name: 'protocol-violation'
                  });
                } catch (e) {
                  // Label might not exist, that's fine
                }
              }
            } else if (isVerification && (!author || !verifier)) {
              // Missing labels on verification issue
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `## 📋 Heterogeneous Protocol Labels Needed

This issue requires agent assignment labels:

**Required labels:**
- \`author:claude\` OR \`author:gemini\` OR \`author:grok\`
- \`verifier:claude\` OR \`verifier:gemini\` OR \`verifier:grok\`

Please add the appropriate labels to enable protocol validation.

---
*Automated check by Trinity Symphony Heterogeneous Protocol Validator*`
              });
            }

  check-ai-context-updated:
    runs-on: ubuntu-latest
    name: Check AI_CONTEXT.md Updated
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Check for AI_CONTEXT.md changes
        id: check_context
        run: |
          if git diff --name-only origin/main...HEAD | grep -q "AI_CONTEXT.md"; then
            echo "updated=true" >> $GITHUB_OUTPUT
          else
            echo "updated=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Warn if AI_CONTEXT.md not updated
        if: steps.check_context.outputs.updated == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            // Check if this PR has significant changes
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number
            });
            
            const significantExtensions = ['.ts', '.tsx', '.js', '.jsx', '.py', '.sql'];
            const hasSignificantChanges = files.some(f => 
              significantExtensions.some(ext => f.filename.endsWith(ext)) &&
              f.changes > 10
            );
            
            if (hasSignificantChanges) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: `## 📝 Reminder: Update AI_CONTEXT.md

This PR contains significant code changes but \`AI_CONTEXT.md\` hasn't been updated.

**Please update the Session Log section** with:
- What was completed
- Any blockers encountered
- Current status of sprint tasks

This ensures the next agent has proper context.

---
*Automated reminder by Trinity Symphony Workflow*`
              });
            }
