# GitHub Labels Configuration
# 
# To apply these labels to your repository, you can use the GitHub CLI:
#
#   gh label create "label-name" --description "description" --color "hex"
#
# Or use a tool like github-label-sync:
#
#   npx github-label-sync --access-token YOUR_TOKEN --labels labels.yml ORG/REPO

