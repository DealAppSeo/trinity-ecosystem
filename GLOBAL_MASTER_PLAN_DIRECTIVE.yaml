# ═══════════════════════════════════════════════════════════════
# SECTION 5: VERIFICATION PROTOCOL
# ═══════════════════════════════════════════════════════════════

# Before ANY system change, run this checklist:

verification_checklist:
  before_diagnosis:
    - "Check agent_heartbeat for last_ping timestamps"
    - "Check trinity_agent_logs for recent activity"
    - "Check trinity_agent_registry for status"
    - "If all three agree → proceed with diagnosis"
    - "If they conflict → STOP, report conflict, ask Sean"

  before_code_change:
    - "Read the file first (never edit blind)"
    - "Check GMPD section 2 for architectural constraints"
    - "Verify the change doesn't contradict dependency_flow"
    - "State which repo owns the code being changed"

  before_directive:
    - "State what you verified and from where"
    - "State what you CANNOT verify"
    - "Recommend the directive to Sean — don't send it yourself"
    - "If urgent, flag urgency but still wait for Sean's go"

