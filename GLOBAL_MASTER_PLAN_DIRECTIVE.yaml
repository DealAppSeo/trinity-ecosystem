# TRINITY GLOBAL MASTER PLAN DIRECTIVE (GMPD)
# Version: 1.0.0 | Last Updated: 2026-04-03
# Status: DRAFT — Awaiting ratification by Sean Goodwin
#
# THIS DOCUMENT MUST BE LOADED AT THE START OF EVERY CHAT SESSION.
# No agent, AI, or human may issue directives that contradict this document.
# Changes require explicit approval from Sean Goodwin + verification against
# the living org chart before implementation.

# ═══════════════════════════════════════════════════════════════
# SECTION 1: HARD RULES (NON-NEGOTIABLE)
# ═══════════════════════════════════════════════════════════════

hard_rules:
  rule_1_verify_before_acting:
    text: "Before any system diagnosis, check a MINIMUM of 3 data sources. State what each shows. If they conflict, STOP and ask Sean."
    applies_to: [claude, gemini, grok, all_agents]
    enforcement: "Any directive issued without verification is void."

  rule_2_no_assumptions:
    text: "Never assume a system is broken, a table is the right one, or a repo is canonical without explicit verification."
    applies_to: [claude, gemini, grok, all_agents]
    enforcement: "If you catch yourself saying 'I think' or 'probably', STOP. Verify."

  rule_3_check_the_gmpd:
    text: "Before making any architectural change, check this document. If the change contradicts the GMPD, it requires Sean's approval."
    applies_to: [claude, gemini, grok, all_agents]
    enforcement: "Unapproved architectural changes must be reverted."

  rule_4_no_cascading_directives:
    text: "No AI may send directives to another AI without Sean's awareness. State 'I recommend telling X to do Y' instead of sending it directly."
    applies_to: [claude, gemini, grok]
    enforcement: "Sean is the only one who dispatches cross-AI directives."

  rule_5_sprint_before_rebuild:
    text: "Never reorganize repos, migrate runtimes, or restructure architecture during an active sprint deadline. Ship first, refactor after."
    applies_to: [claude, gemini, grok, all_agents]
    enforcement: "Architecture changes only in designated refactor windows."

  rule_6_notification_on_limits:
    text: "When any free tier or paid plan limit is approached (80% usage), notify Sean via Telegram AND email immediately."
    applies_to: [all_services]
    channels: [telegram, email]
    threshold_warning: 0.80
    threshold_critical: 0.95

# ═══════════════════════════════════════════════════════════════
# SECTION 2: CANONICAL ARCHITECTURE (LIVING ORG CHART)
# ═══════════════════════════════════════════════════════════════

# This is the SINGLE SOURCE OF TRUTH for what controls what.
# Every AI and agent must reference this before making changes.

