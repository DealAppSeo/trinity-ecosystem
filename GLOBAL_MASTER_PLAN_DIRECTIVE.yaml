    publishes: "@trinitysymphony/agents"
    language: "TypeScript (primary) + Rust (ANFIS engine, future)"
    repo: "DealAppSeo/trinity-ecosystem"
    status: "active — agents running on Railway"
    current_runtime: "trinity-shared-temp (V4 JS) — migration to trinity-ecosystem planned"

  # ─── LAYER 2: TRUST INFRASTRUCTURE ───
  trustshell:
    description: "Thin ZKP wrapper — first HyperDAG licensee"
    owns:
      - "AES-256-GCM key encryption (BYOK)"
      - "ZKP proof generation/verification"
      - "RepID credential wrapping"
    imports_from: ["@hyperdag/core"]
    publishes: "@hyperdag/trustshell (npm)"
    repo: "TBD — trustshell"
    status: "planning"

  trustrails:
    description: "Compliance UI + API — first TrustShell consumer"
    owns:
      - "KYA/KYB compliance receipts"
      - "DBT → SBT pipeline UI"
      - "2FA → 4FA verification flow"
      - "Institutional risk configuration"
      - "Vertical licenses (Banking, CRE, Healthcare)"
    imports_from: ["@hyperdag/trustshell"]
    repo: "DealAppSeo/trustrails-dev"
    domain: "trustenvoy.dev / trustrails.dev"
    status: "active — 403 on API endpoints needs fix"
    mvp_target: "2026-04-17 (CRE vertical)"

  # ─── LAYER 3: PRODUCT APPS ───
  products:
    ai_social_mirror:
      description: "Healing + identity app"
      imports_from: ["@hyperdag/trustshell", "@trinitysymphony/agents"]
      status: "planned"
    purpose_hub:
      description: "Mission alignment platform"
      imports_from: ["@hyperdag/trustshell"]
      domain: "purposehub.ai"
      status: "planned"
    trust_squad:
      description: "Team trust verification"
      imports_from: ["@hyperdag/trustshell"]
      status: "planned"

# ─── DEPENDENCY FLOW (who calls whom) ───
dependency_flow: |
  Products (TrustRails, SocialMirror, PurposeHub)
    ↓ imports
  TrustShell (@hyperdag/trustshell)
    ↓ imports
  HyperDAG Protocol (@hyperdag/core)
    ↑ consumed by
  AI Trinity Symphony (agent swarm)
    ↑ orchestrates
  12 Constitutional Agents (Railway services)

# ─── DATABASE TABLES (verified sources of truth) ───
database:
  agent_health_tables:
    primary: "agent_heartbeat"        # WHERE AGENTS ACTUALLY WRITE
    secondary: "trinity_agent_registry" # SSOT for registry/status
    legacy: "trinity_heartbeat"         # STALE — do not use for diagnosis
    logs: "trinity_agent_logs"          # Activity audit trail
    note: "ALWAYS check agent_heartbeat AND trinity_agent_logs before concluding agent health"

  task_tables:
    tasks: "trinity_tasks"
    artifacts: "trinity_artifacts"
    benchmarks: "trinity_agent_benchmarks"
    retros: "trinity_retros"

  trust_tables:
    receipts: "x402_receipts"
    compliance: "kya_compliance_receipts"  # In trustrails-dev, not trinity-ecosystem

  identity_tables:
    dbt_records: "dbt_records"
    sbt_tokens: "sbt_tokens"

# ─── SMART CONTRACTS (Base Sepolia) ───
