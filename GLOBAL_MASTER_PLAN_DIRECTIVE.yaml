      - "@hyperdag/core (npm + Rust crate)"
    language: "Rust (primary) + TypeScript (bindings)"
    repo: "TBD — hyperdag-protocol"
    status: "planning"
    patents: [P-002, P-013, P-015, P-016, P-018, P-024, P-025, P-026, P-027]

  # ─── LAYER 1: AGENT INFRASTRUCTURE ───
