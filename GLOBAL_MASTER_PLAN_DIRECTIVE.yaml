background_build:
  name: "Rust Dual-Repo Hybrid Architecture"
  description: |
    The ultimate target architecture. Built incrementally using idle
    compute cycles. Does NOT block sprint work. Does NOT get priority
    over sprint directives.

  target_repos:
    hyperdag_core:
      language: "Rust"
      contains: "ZKP circuits, ANFIS engine, DAG consensus, x402 transport"
      priority: "Build ANFIS LASSO router in Rust first"

    hyperdag_agents:
      language: "Rust + TypeScript FFI"
      contains: "Agent directive engine, scoring, routing inputs"
      priority: "After ANFIS router is proven"

    trustshell_sdk:
      language: "TypeScript (wraps Rust core via WASM)"
      contains: "BYOK encryption, ZKP proof API, RepID credentials"
      priority: "After hyperdag_core publishes crate"

  resource_policy:
    free_tier_only: true
    notification_threshold: 0.80
    notification_channels: [telegram, email]
    idle_compute_only: true
    never_blocks_sprint: true

