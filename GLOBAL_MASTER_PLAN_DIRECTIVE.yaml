    description: "12-agent neuromorphic swarm runtime"
    owns:
      - "Constitutional Agent framework (V5 TypeScript)"
      - "SBFA anti-hallucination (multi-LLM diversity)"
      - "Bilateral learning + LAO"
      - "Agent task loop, BFT consensus, RepID"
      - "Federated pattern extraction"
